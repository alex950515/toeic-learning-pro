<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多益單字隨身準備庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Core SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <!-- Firebase Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-extrabold text-blue-400">多益單字準備庫</h1>
        <span id="syncHeaderBadge" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">離線模式</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="switchTab('words')" id="btnTabWords" class="px-4 py-2 rounded-lg font-semibold bg-blue-600 text-white shadow-lg">單字庫</button>
        <button onclick="switchTab('quiz')" id="btnTabQuiz" class="px-4 py-2 rounded-lg font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200">單字測驗</button>
        <button onclick="switchTab('notebook')" id="btnTabNotebook" class="px-4 py-2 rounded-lg font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 relative">
          錯題本 <span id="wrongCountBadge" class="hidden ml-1 text-xs bg-red-500 text-white px-2 py-0.5 rounded-full">0</span>
        </button>
        <button onclick="switchTab('history')" id="btnTabHistory" class="px-4 py-2 rounded-lg font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200">測驗紀錄</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6">

    <!-- 雲端同步設定區 -->
    <section class="mb-6 bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <span class="text-xl">☁️</span>
          <div>
            <h3 class="font-bold text-slate-200">跨裝置即時同步 (Firebase)</h3>
            <p class="text-xs text-slate-400">兩台裝置輸入相同的「專屬同步金鑰」，資料就會透過雲端自動同步！</p>
          </div>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <input type="text" id="syncKeyInput" placeholder="自訂金鑰 (例如: toeic2026)" class="bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm w-full sm:w-48 focus:outline-none focus:border-blue-500 text-slate-100">
          <button onclick="enableLiveSync()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-1.5 rounded-lg whitespace-nowrap transition-colors">連線同步</button>
        </div>
      </div>
      <div id="syncStatus" class="text-xs text-slate-400 mt-2 font-mono">連線狀態: 未連線 (目前使用本機記憶體)</div>
    </section>

    <!-- Tab 1: 單字庫管理 -->
    <section id="tabWords" class="space-y-6">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
        <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">➕ 新增單字</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
          <input type="text" id="addWord" placeholder="英文單字 (例: accommodate)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
          <input type="text" id="addMeaning" placeholder="中文解釋 (例: 容納; 提供住宿)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
          <input type="text" id="addCategory" placeholder="分類 (例: 商務/職場)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" list="categoryOptions">
          <datalist id="categoryOptions"></datalist>
          <button onclick="addWordItem()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg px-4 py-2 transition-colors">新增單字</button>
        </div>
      </div>

      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-4">
          <h2 class="text-lg font-bold text-slate-200">📚 單字列表</h2>
          <div class="flex items-center gap-3 w-full sm:w-auto">
            <input type="text" id="searchWordInput" oninput="renderWordTable()" placeholder="搜尋單字/解釋..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm w-full sm:w-48 focus:outline-none focus:border-blue-500">
            <select id="filterCategorySelect" onchange="renderWordTable()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500 text-slate-200">
              <option value="ALL">全部分類</option>
            </select>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-900/60 text-slate-400 border-b border-slate-700">
              <tr>
                <th class="py-3 px-4">單字</th>
                <th class="py-3 px-4">解釋</th>
                <th class="py-3 px-4">分類</th>
                <th class="py-3 px-4 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="wordTableBody" class="divide-y divide-slate-700/50">
              <!-- 單字列表動態生成 -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Tab 2: 單字測驗 -->
    <section id="tabQuiz" class="hidden space-y-6">
      <div id="quizSetupCard" class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center max-w-xl mx-auto">
        <h2 class="text-xl font-bold text-slate-100 mb-2">🎯 開始單字測驗</h2>
        <p class="text-slate-400 text-sm mb-6">選擇測驗範圍及題目數量</p>
        
        <div class="space-y-4 text-left mb-6">
          <div>
            <label class="block text-sm text-slate-300 mb-1">測驗分類</label>
            <select id="quizCategorySelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-slate-200">
              <option value="ALL">全部分類</option>
            </select>
          </div>
          <div>
            <label class="block text-sm text-slate-300 mb-1">題目數量</label>
            <select id="quizCountSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-slate-200">
              <option value="5">5 題</option>
              <option value="10" selected>10 題</option>
              <option value="20">20 題</option>
            </select>
          </div>
        </div>

        <button onclick="startQuiz()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition-colors">開始測驗</button>
      </div>

      <div id="quizCard" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-xl mx-auto relative">
        <div class="flex justify-between items-center text-xs text-slate-400 mb-4">
          <span id="quizProgressText">第 1 / 10 題</span>
          <span id="quizCategoryBadge" class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded">通用</span>
        </div>

        <div class="text-center py-6 border-y border-slate-700/50 my-2">
          <h3 id="quizQuestionWord" class="text-3xl font-extrabold text-blue-400 tracking-wide mb-2">word</h3>
        </div>

        <div id="quizOptionsContainer" class="grid grid-cols-1 gap-3 my-6">
          <!-- 選項動態生成 -->
        </div>

        <button id="quizNextBtn" onclick="nextQuestion()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition-colors">下一題 ➔</button>
      </div>
    </section>

    <!-- Tab 3: 錯題本 -->
    <section id="tabNotebook" class="hidden space-y-6">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">📕 錯題複習庫</h2>
          <span class="text-xs text-slate-400">做錯的題目會自動收集到這裡</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-900/60 text-slate-400 border-b border-slate-700">
              <tr>
                <th class="py-3 px-4">單字</th>
                <th class="py-3 px-4">正確解釋</th>
                <th class="py-3 px-4">做錯次數</th>
                <th class="py-3 px-4 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="notebookTableBody" class="divide-y divide-slate-700/50">
              <!-- 錯題列表動態生成 -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Tab 4: 測驗紀錄 -->
    <section id="tabHistory" class="hidden space-y-6">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
        <h2 class="text-lg font-bold text-slate-200 mb-4">📊 歷史測驗成績</h2>
        <div class="space-y-3" id="historyListContainer">
          <!-- 歷史紀錄動態生成 -->
        </div>
      </div>
    </section>

  </main>

  <script>
    // ==========================================
    // 0. 全域變數 & Firebase 初始化區塊
    // ==========================================
    const FIREBASE_DATABASE_URL = "https://rong-toeic-app-default-rtdb.asia-southeast1.firebasedatabase.app/";

    const firebaseConfig = {
      databaseURL: FIREBASE_DATABASE_URL
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    // 強制指定亞洲伺服器節點的全域 db 物件
    const db = firebase.app().database(FIREBASE_DATABASE_URL);
    let dbRef = null;
    let isSyncing = false;

    // 資料狀態
    let wordBank = JSON.parse(localStorage.getItem("toeic_words")) || [
      { id: 1, word: "accommodate", meaning: "容納; 提供住宿", category: "商務/住宿" },
      { id: 2, word: "implement", meaning: "實施; 執行", category: "職場/管理" },
      { id: 3, word: "negotiation", meaning: "談判; 協商", category: "商務/談判" }
    ];
    let wrongWords = JSON.parse(localStorage.getItem("toeic_wrong")) || {};
    let quizHistory = JSON.parse(localStorage.getItem("toeic_history")) || [];

    // 測驗狀態
    let currentQuizList = [];
    let currentQuizIndex = 0;
    let quizScore = 0;

    // 頁面載入時初始化
    window.addEventListener("DOMContentLoaded", () => {
      renderCategories();
      renderWordTable();
      renderNotebookTable();
      renderHistoryList();
      updateWrongCountBadge();

      // 自動檢查是否有舊金鑰
      const savedKey = localStorage.getItem("toeic_sync_key");
      if (savedKey) {
        document.getElementById("syncKeyInput").value = savedKey;
        enableLiveSync();
      }
    });

    // Save Local Storage
    function saveToLocal() {
      localStorage.setItem("toeic_words", JSON.stringify(wordBank));
      localStorage.setItem("toeic_wrong", JSON.stringify(wrongWords));
      localStorage.setItem("toeic_history", JSON.stringify(quizHistory));
    }

    // 推送資料到雲端
    function pushToCloud() {
      const syncKey = localStorage.getItem("toeic_sync_key");
      if (!syncKey || !dbRef) return;
      
      isSyncing = true;
      dbRef.set({
        words: wordBank,
        wrong: wrongWords,
        history: quizHistory,
        updatedAt: new Date().toISOString()
      }, (err) => {
        isSyncing = false;
        if (err) console.error("Cloud push failed:", err);
      });
    }

    // ==========================================
    // 1. Firebase Live Sync 雲端同步核心邏輯
    // ==========================================
    function enableLiveSync() {
      const syncKey = document.getElementById("syncKeyInput").value.trim();
      if (!syncKey) {
        alert("請輸入您的專屬同步金鑰！");
        return;
      }

      try {
        const statusDiv = document.getElementById("syncStatus");
        statusDiv.className = "text-xs text-amber-400 font-mono mt-2";
        statusDiv.innerText = "⏳ 正在連線雲端資料庫...";

        // 指向 Firebase 資料庫位置
        dbRef = db.ref("users/" + syncKey);

        dbRef.once("value", (snapshot) => {
          const cloudData = snapshot.val();
          if (cloudData) {
            if (confirm("☁️ 偵測到雲端已有同步單字庫！是否載入雲端資料覆蓋本地？")) {
              wordBank = cloudData.words || [];
              wrongWords = cloudData.wrong || {};
              quizHistory = cloudData.history || [];
              saveToLocal();
              renderCategories();
              renderWordTable();
              renderNotebookTable();
              renderHistoryList();
              updateWrongCountBadge();
            }
          } else {
            pushToCloud();
          }

          // 監聽雲端即時變更
          dbRef.on("value", (snap) => {
            if (isSyncing) return;
            const data = snap.val();
            if (data) {
              wordBank = data.words || [];
              wrongWords = data.wrong || {};
              quizHistory = data.history || [];
              saveToLocal();
              renderCategories();
              renderWordTable();
              renderNotebookTable();
              renderHistoryList();
              updateWrongCountBadge();
            }
          });

          statusDiv.className = "text-xs text-emerald-400 font-mono mt-2";
          statusDiv.innerText = "☁️ 雲端即時連線同步中 (金鑰: " + syncKey + ")";
          document.getElementById("syncHeaderBadge").className = "text-xs bg-emerald-900/80 text-emerald-300 border border-emerald-600 px-2.5 py-1 rounded-full";
          document.getElementById("syncHeaderBadge").innerText = "☁️ 雲端即時同步中";
          localStorage.setItem("toeic_sync_key", syncKey);

        }, (error) => {
          alert("❌ Firebase 連線失敗：" + error.message);
          statusDiv.className = "text-xs text-red-400 font-mono mt-2";
          statusDiv.innerText = "❌ 連線失敗: " + error.message;
        });

      } catch (err) {
        alert("程式執行錯誤：" + err.message);
      }
    }

    // ==========================================
    // 2. UI 頁籤切換與渲染
    // ==========================================
    function switchTab(tab) {
      ['Words', 'Quiz', 'Notebook', 'History'].forEach(t => {
        document.getElementById('tab' + t).classList.add('hidden');
        const btn = document.getElementById('btnTab' + t);
        btn.className = "px-4 py-2 rounded-lg font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 transition-colors";
      });

      document.getElementById('tab' + capitalize(tab)).classList.remove('hidden');
      document.getElementById('btnTab' + capitalize(tab)).className = "px-4 py-2 rounded-lg font-semibold bg-blue-600 text-white shadow-lg";
    }

    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    function renderCategories() {
      const categories = [...new Set(wordBank.map(item => item.category).filter(Boolean))];
      
      const filterSelect = document.getElementById("filterCategorySelect");
      filterSelect.innerHTML = `<option value="ALL">全部分類</option>` + 
        categories.map(c => `<option value="${c}">${c}</option>`).join("");

      const quizSelect = document.getElementById("quizCategorySelect");
      quizSelect.innerHTML = `<option value="ALL">全部分類</option>` + 
        categories.map(c => `<option value="${c}">${c}</option>`).join("");

      const datalist = document.getElementById("categoryOptions");
      datalist.innerHTML = categories.map(c => `<option value="${c}">`).join("");
    }

    function renderWordTable() {
      const search = document.getElementById("searchWordInput").value.toLowerCase();
      const filterCat = document.getElementById("filterCategorySelect").value;
      const tbody = document.getElementById("wordTableBody");

      const filtered = wordBank.filter(w => {
        const matchSearch = w.word.toLowerCase().includes(search) || w.meaning.toLowerCase().includes(search);
        const matchCat = filterCat === "ALL" || w.category === filterCat;
        return matchSearch && matchCat;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500">尚無單字資料</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(w => `
        <tr class="hover:bg-slate-800/50 transition-colors">
          <td class="py-3 px-4 font-bold text-blue-300">${w.word}</td>
          <td class="py-3 px-4 text-slate-200">${w.meaning}</td>
          <td class="py-3 px-4"><span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded">${w.category || '通用'}</span></td>
          <td class="py-3 px-4 text-center">
            <button onclick="deleteWord(${w.id})" class="text-xs bg-red-900/40 text-red-300 hover:bg-red-800/60 px-2.5 py-1 rounded transition-colors">刪除</button>
          </td>
        </tr>
      `).join("");
    }

    function addWordItem() {
      const wordInput = document.getElementById("addWord");
      const meaningInput = document.getElementById("addMeaning");
      const categoryInput = document.getElementById("addCategory");

      const word = wordInput.value.trim();
      const meaning = meaningInput.value.trim();
      const category = categoryInput.value.trim() || "通用";

      if (!word || !meaning) {
        alert("請輸入單字與中文解釋！");
        return;
      }

      const newItem = { id: Date.now(), word, meaning, category };
      wordBank.unshift(newItem);
      saveToLocal();
      pushToCloud();

      wordInput.value = "";
      meaningInput.value = "";
      categoryInput.value = "";

      renderCategories();
      renderWordTable();
    }

    function deleteWord(id) {
      if (!confirm("確定要刪除這個單字嗎？")) return;
      wordBank = wordBank.filter(w => w.id !== id);
      saveToLocal();
      pushToCloud();
      renderCategories();
      renderWordTable();
    }

    // ==========================================
    // 3. 單字測驗核心邏輯
    // ==========================================
    function startQuiz() {
      const cat = document.getElementById("quizCategorySelect").value;
      const count = parseInt(document.getElementById("quizCountSelect").value);

      let pool = cat === "ALL" ? [...wordBank] : wordBank.filter(w => w.category === cat);

      if (pool.length < 4) {
        alert("該分類的單字量不足 4 個，無法產生四選一測驗題目！");
        return;
      }

      pool.sort(() => Math.random() - 0.5);
      currentQuizList = pool.slice(0, Math.min(count, pool.length));
      currentQuizIndex = 0;
      quizScore = 0;

      document.getElementById("quizSetupCard").classList.add("hidden");
      document.getElementById("quizCard").classList.remove("hidden");
      showQuestion();
    }

    function showQuestion() {
      const q = currentQuizList[currentQuizIndex];
      document.getElementById("quizProgressText").innerText = `第 ${currentQuizIndex + 1} / ${currentQuizList.length} 題`;
      document.getElementById("quizCategoryBadge").innerText = q.category || "通用";
      document.getElementById("quizQuestionWord").innerText = q.word;

      // 產生選項 (1個正確 + 3個錯誤)
      let wrongPool = wordBank.filter(w => w.word !== q.word);
      wrongPool.sort(() => Math.random() - 0.5);
      let options = [q.meaning, ...wrongPool.slice(0, 3).map(w => w.meaning)];
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById("quizOptionsContainer");
      container.innerHTML = options.map(opt => `
        <button onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}', '${q.meaning.replace(/'/g, "\\'")}')" 
                class="quiz-opt-btn w-full text-left bg-slate-900 border border-slate-700 hover:border-blue-500 rounded-lg p-3 text-sm font-medium transition-all">
          ${opt}
        </button>
      `).join("");

      document.getElementById("quizNextBtn").classList.add("hidden");
    }

    function checkAnswer(btn, selected, correct) {
      const buttons = document.querySelectorAll(".quiz-opt-btn");
      buttons.forEach(b => b.disabled = true);

      const q = currentQuizList[currentQuizIndex];

      if (selected === correct) {
        btn.classList.add("bg-emerald-900/60", "border-emerald-500", "text-emerald-200");
        quizScore++;
      } else {
        btn.classList.add("bg-red-900/60", "border-red-500", "text-red-200");
        buttons.forEach(b => {
          if (b.innerText.trim() === correct) {
            b.classList.add("bg-emerald-900/60", "border-emerald-500", "text-emerald-200");
          }
        });
        
        // 紀錄錯題
        wrongWords[q.word] = {
          meaning: q.meaning,
          count: (wrongWords[q.word]?.count || 0) + 1
        };
        saveToLocal();
        pushToCloud();
        updateWrongCountBadge();
      }

      document.getElementById("quizNextBtn").classList.remove("hidden");
    }

    function nextQuestion() {
      currentQuizIndex++;
      if (currentQuizIndex < currentQuizList.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const total = currentQuizList.length;
      const pct = Math.round((quizScore / total) * 100);

      quizHistory.unshift({
        date: new Date().toLocaleString("zh-TW"),
        score: quizScore,
        total: total,
        pct: pct
      });
      saveToLocal();
      pushToCloud();

      alert(`🎉 測驗完成！\n得分: ${quizScore} / ${total} (${pct}分)`);

      document.getElementById("quizCard").classList.add("hidden");
      document.getElementById("quizSetupCard").classList.remove("hidden");
      renderNotebookTable();
      renderHistoryList();
    }

    // ==========================================
    // 4. 錯題本 & 歷史紀錄邏輯
    // ==========================================
    function updateWrongCountBadge() {
      const count = Object.keys(wrongWords).length;
      const badge = document.getElementById("wrongCountBadge");
      if (count > 0) {
        badge.innerText = count;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    function renderNotebookTable() {
      const tbody = document.getElementById("notebookTableBody");
      const keys = Object.keys(wrongWords);

      if (keys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500">太棒了！目前沒有錯題紀錄！</td></tr>`;
        return;
      }

      tbody.innerHTML = keys.map(word => `
        <tr class="hover:bg-slate-800/50 transition-colors">
          <td class="py-3 px-4 font-bold text-red-400">${word}</td>
          <td class="py-3 px-4 text-slate-200">${wrongWords[word].meaning}</td>
          <td class="py-3 px-4"><span class="text-xs bg-red-950 text-red-300 border border-red-800 px-2 py-0.5 rounded-full">${wrongWords[word].count} 次</span></td>
          <td class="py-3 px-4 text-center">
            <button onclick="removeWrongWord('${word}')" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded transition-colors">移除</button>
          </td>
        </tr>
      `).join("");
    }

    function removeWrongWord(word) {
      delete wrongWords[word];
      saveToLocal();
      pushToCloud();
      renderNotebookTable();
      updateWrongCountBadge();
    }

    function renderHistoryList() {
      const container = document.getElementById("historyListContainer");
      if (quizHistory.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-slate-500">尚無測驗紀錄</div>`;
        return;
      }

      container.innerHTML = quizHistory.map(h => `
        <div class="flex items-center justify-between bg-slate-900 border border-slate-700 rounded-lg p-3">
          <div>
            <div class="text-sm font-semibold text-slate-200">得分：${h.score} / ${h.total}</div>
            <div class="text-xs text-slate-400">${h.date}</div>
          </div>
          <div class="text-lg font-bold ${h.pct >= 80 ? 'text-emerald-400' : 'text-amber-400'}">${h.pct} 分</div>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
